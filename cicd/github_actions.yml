name: AURA-G CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg
      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: |
          pip install mypy
          mypy aura_g --ignore-missing-imports || true
      - name: Test
        run: pytest tests/ -v --cov=aura_g --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

  build-plugin:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libx11-dev \
            libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libcurl4-openssl-dev cmake ninja-build
      - name: Configure
        run: cmake -B plugin/build -S plugin -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build plugin/build --config Release
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AURA-G-${{ matrix.os }}
          path: plugin/build/AuraG_artefacts/Release/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aura-g:ci .
      - name: Smoke test
        run: |
          docker run --rm aura-g:ci python -c "import aura_g; print('ok')"
