stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.11
  before_script:
    - apt-get update && apt-get install -y libsndfile1 ffmpeg
    - pip install -e '.[dev]'
  script:
    - ruff check .
    - pytest tests/ -v --cov=aura_g

build-plugin:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update
    - apt-get install -y build-essential cmake ninja-build git \
        libasound2-dev libfreetype6-dev libx11-dev libxext-dev \
        libxrandr-dev libxinerama-dev libxcursor-dev libcurl4-openssl-dev
  script:
    - cmake -B plugin/build -S plugin -G Ninja -DCMAKE_BUILD_TYPE=Release
    - cmake --build plugin/build --config Release
  artifacts:
    paths:
      - plugin/build/AuraG_artefacts/Release/

build-docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  only:
    - main
  script:
    - kubectl set image deployment/aura-g aura-g=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
