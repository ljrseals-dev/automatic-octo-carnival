[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-g"
version = "0.1.0"
description = "Adaptive Unified Real-time Architecture for Guitar"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AURA-G Contributors" }]
keywords = ["guitar", "audio", "dsp", "neural", "effects"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Effects",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "librosa>=0.10",
    "torch>=2.0",
    "torchaudio>=2.0",
]

[project.optional-dependencies]
realtime = ["sounddevice>=0.4.6"]
ui = ["streamlit>=1.30", "gradio>=4.20"]
api = ["fastapi", "uvicorn", "python-multipart"]
plugins = ["pedalboard>=0.8"]
midi = ["mido>=1.3"]
dev = ["pytest>=7", "pytest-cov", "black", "ruff"]
all = [
    "sounddevice>=0.4.6",
    "streamlit>=1.30",
    "gradio>=4.20",
    "fastapi", "uvicorn", "python-multipart",
    "pedalboard>=0.8",
    "mido>=1.3",
]

[project.scripts]
aura-g = "run_all:main"
aura-g-batch = "root.batch_processor:batch_process"
aura-g-server = "root.server:run"
aura-g-worker = "root.worker:run_worker"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]
